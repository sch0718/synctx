# Default values for synctx.

podSecurityContext:
  runAsNonRoot: true

metrics:
  enabled: true

synctxConfig:
  create: false
  data: ""

viewer:
  image:
    repository: synctx/viewer
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

cdn:
  image:
    repository: synctx/cdn
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicaCount: 1
  persistence:
    enabled: true
    size: 10Gi
    accessMode: ReadWriteMany
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

sync:
  image:
    repository: synctx/sync
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  schedule: "*/5 * * * *"
  persistence:
    enabled: true
    size: 1Gi
    accessMode: ReadWriteOnce
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

feedback:
  enabled: false
  image:
    repository: synctx/feedback
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  schedule: "*/5 * * * *"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  secrets:
    create: false
    existingSecret: ""
    hmacKey: ""
    hashSalt: ""
    smtpCredential: ""
    opApiKey: ""
    xwikiCredential: ""

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
  hosts:
    - host: synctx.internal
      paths:
        - path: /view(/(.*))?
          pathType: ImplementationSpecific
          backend: viewer
        - path: /cdn(/(.*))?
          pathType: ImplementationSpecific
          backend: cdn
        - path: /marp(/(.*))?
          pathType: ImplementationSpecific
          backend: marp
        - path: /slides(/(.*))?
          pathType: ImplementationSpecific
          backend: slides
        - path: /drawio(/(.*))?
          pathType: ImplementationSpecific
          backend: drawio

marp:
  image:
    repository: synctx/marp
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

slides:
  image:
    repository: nginx
    tag: "1.25.4-alpine"
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    size: 5Gi
    accessMode: ReadWriteMany
    storageClass: ""
  sidecar:
    image:
      repository: alpine/git
      tag: "2.43.0"
      pullPolicy: IfNotPresent
  replicaCount: 1
  publishRepoUrl: "https://gitlab.internal/team/published-slides.git"
  pollingIntervalSeconds: "60"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

drawio:
  image:
    repository: jgraph/drawio
    tag: "24.2.5"
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

git:
  secrets:
    create: false
    existingSecret: ""
    readToken: ""
    publishToken: ""
