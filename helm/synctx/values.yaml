# Default values for synctx.

podSecurityContext:
  runAsNonRoot: true

metrics:
  enabled: true
  # Sync·Feedback CronJob 메트릭을 받아 두는 Pushgateway. metrics.enabled이고 sync.persistence가 켜졌고 sync 또는 feedback이 켜졌을 때만 배포한다.
  pushgateway:
    image:
      repository: prom/pushgateway
      tag: "v1.11.1"
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 128Mi

synctxConfig:
  create: false
  data: ""

# 서비스별 배포 여부. 꺼진 서비스는 리소스와 Ingress 경로를 만들지 않는다.
viewer:
  enabled: true
  renderTokenSecret:
    create: false
    existingSecret: ""
    current: ""
    previous: ""
  image:
    repository: synctx/viewer
    tag: "0.8.2"
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

cdn:
  enabled: true
  image:
    repository: synctx/cdn
    tag: "0.8.2"
    pullPolicy: IfNotPresent
  replicaCount: 1
  persistence:
    enabled: true
    size: 10Gi
    accessMode: ReadWriteMany
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

sync:
  enabled: true
  image:
    repository: synctx/sync
    tag: "0.8.2"
    pullPolicy: IfNotPresent
  schedule: "*/5 * * * *"
  persistence:
    enabled: true
    size: 1Gi
    accessMode: ReadWriteOnce
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

feedback:
  enabled: false
  image:
    repository: synctx/feedback
    tag: "0.8.2"
    pullPolicy: IfNotPresent
  schedule: "*/5 * * * *"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  secrets:
    create: false
    existingSecret: ""
    hmacKey: ""
    hashSalt: ""
    smtpCredential: ""
    opApiKey: ""
    xwikiCredential: ""
    # html_embed.enabled 저장소 전용 XWiki 계정. 대상 공간 한정 스크립트 권한은 이 계정에만 준다.
    # true면 XWIKI_HTML_CREDENTIAL을 Secret의 xwiki-html-credential 키에 연결한다(existingSecret이면 그 Secret에 키가 있어야 한다).
    xwikiHtmlCredentialEnabled: false
    # create: true일 때 Secret에 넣을 값(user:password). 값을 주면 xwikiHtmlCredentialEnabled 없이도 연결한다.
    xwikiHtmlCredential: ""

jitsi:
  enabled: false
  imageTag: "stable-9823"  # Docker Hub 실존·아키텍처 미확인, 반입 전 `docker manifest inspect`
  host: ""
  publicUrl: ""
  appId: synctx
  ingress:
    className: nginx
    annotations: {}
    tlsSecretName: jitsi-tls
  jwtSecret:
    create: false
    existingSecret: ""
    current: ""
    previous: ""
  roomSecret:
    create: false
    existingSecret: ""
    current: ""
    previous: ""
  xmppSecret:
    create: false
    existingSecret: ""
    jicofoPassword: ""
    jvbPassword: ""
  jvb:
    advertisedIPs: ""  # 쉼표 구분 IP 목록(포트 없음)
    exposure: NodePort
    nodePort: 31000
    tcpNodePort: 30443
    tcpFallback: false
  images:
    web:
      repository: jitsi/web
    prosody:
      repository: jitsi/prosody
    jicofo:
      repository: jitsi/jicofo
    jvb:
      repository: jitsi/jvb
  resources:
    web:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: 300m, memory: 256Mi}
    prosody:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: 300m, memory: 256Mi}
    jicofo:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: 500m, memory: 512Mi}
    jvb:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: 1000m, memory: 512Mi}

collabGateway:
  enabled: false
  image:
    repository: synctx/collab-gateway
    tag: "0.8.2"
    pullPolicy: IfNotPresent
  # 알림 중복 방지 상태 파일(PVC). 꺼 두면 렌더가 실패한다. 복제본은 1개로 고정한다(replicaCount를 두지 않는다).
  persistence:
    enabled: true
    size: 256Mi
    accessMode: ReadWriteOnce
    storageClass: ""
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  # .synctx.yaml의 collab.gateway 환경변수 이름은 기본값(MATTERMOST_BOT_TOKEN·VIEWER_SERVICE_TOKEN·MATTERMOST_COMMAND_TOKEN)을 쓴다.
  secrets:
    create: false
    existingSecret: ""   # 키: bot-token, viewer-service-token, command-token(선택)
    botToken: ""
    viewerServiceToken: ""
    commandToken: ""
  networkPolicy:
    enabled: true
    # Mattermost가 있는 네임스페이스와 포트. namespace가 비면 그 포트로 어디든 나갈 수 있다.
    mattermost:
      namespace: ""
      port: 443

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
  hosts:
    - host: synctx.internal
      paths:
        - path: /view(/(.*))?
          pathType: ImplementationSpecific
          backend: viewer
        - path: /cdn(/(.*))?
          pathType: ImplementationSpecific
          backend: cdn
        - path: /marp(/(.*))?
          pathType: ImplementationSpecific
          backend: marp
        - path: /slides(/(.*))?
          pathType: ImplementationSpecific
          backend: slides
        - path: /drawio(/(.*))?
          pathType: ImplementationSpecific
          backend: drawio

marp:
  enabled: true
  image:
    repository: synctx/marp
    tag: "0.8.2"
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

slides:
  enabled: true
  image:
    repository: nginx
    tag: "1.25.4-alpine"
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    size: 5Gi
    accessMode: ReadWriteMany
    storageClass: ""
  sidecar:
    image:
      repository: alpine/git
      tag: "2.43.0"
      pullPolicy: IfNotPresent
  replicaCount: 1
  publishRepoUrl: "https://gitlab.internal/team/published-slides.git"
  pollingIntervalSeconds: "60"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

drawio:
  enabled: true
  image:
    repository: jgraph/drawio
    tag: "24.2.5"
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

git:
  secrets:
    create: false
    existingSecret: ""
    readToken: ""
    publishToken: ""
