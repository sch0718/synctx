{{- if include "synctx.isEnabled" .Values.sync }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "synctx.fullname" . }}-sync-network-policy
  labels:
    app.kubernetes.io/name: sync
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: sync
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 443
          protocol: TCP
        - port: 80
          protocol: TCP
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- if include "synctx.syncMetricsPush" . }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pushgateway
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: 9091
          protocol: TCP
    {{- end }}
{{- end }}
