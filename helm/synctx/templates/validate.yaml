{{- include "synctx.validate" . }}
{{- $j := .Values.jitsi | default dict }}
{{- $cfg := dict }}
{{- if .Values.synctxConfig.create }}
{{- $cfg = dig "collab" "jitsi" dict (fromYaml (.Values.synctxConfig.data | default "")) }}
{{- end }}
{{- $enabled := eq (toString (dig "enabled" false $cfg)) "true" }}
{{- range $slot := list "jwtSecret" "roomSecret" }}
{{- $s := get $j $slot | default dict }}
{{- if and $s.create $s.existingSecret }}
{{- fail (printf "jitsi.%s.create와 existingSecret은 함께 지정할 수 없습니다" $slot) }}
{{- end }}
{{- if and (or $s.create $s.previous) (lt (len ($s.current | default "")) 32) }}
{{- fail (printf "jitsi.%s.current는 32바이트 이상이어야 합니다" $slot) }}
{{- end }}
{{- if and $s.previous (lt (len $s.previous) 32) }}
{{- fail (printf "jitsi.%s.previous는 32바이트 이상이어야 합니다" $slot) }}
{{- end }}
{{- if and (or $j.enabled $enabled) (not (or $s.create $s.existingSecret)) }}
{{- fail (printf "jitsi.%s.create 또는 existingSecret이 필요합니다" $slot) }}
{{- end }}
{{- end }}
{{- if and (dig "jwtSecret" "current" "" $j) (eq (dig "jwtSecret" "current" "" $j) (dig "roomSecret" "current" "" $j)) }}
{{- fail "Jitsi 앱 키와 방 이름 키는 서로 달라야 합니다" }}
{{- end }}
{{- if or $j.enabled $enabled }}
{{- if not (include "synctx.isEnabled" .Values.viewer) }}
{{- fail "Jitsi 참여에는 viewer가 필요합니다" }}
{{- end }}
{{- range $key, $default := dict "secret_env" "JITSI_APP_SECRET" "room_secret_env" "JITSI_ROOM_SECRET" }}
{{- $name := get $cfg $key | default $default }}
{{- if not (regexMatch "^[A-Z_][A-Z0-9_]*$" $name) }}
{{- fail "collab.jitsi secret 환경변수 이름이 잘못되었습니다" }}
{{- end }}
{{- end }}
{{- end }}
{{- if or $j.enabled $enabled }}
{{- $app := get $cfg "secret_env" | default "JITSI_APP_SECRET" }}
{{- $room := get $cfg "room_secret_env" | default "JITSI_ROOM_SECRET" }}
{{- $appSlots := list $app (printf "%s_FILE" $app) (printf "%s_PREVIOUS" $app) (printf "%s_PREVIOUS_FILE" $app) }}
{{- range $suffix := list "" "_FILE" "_PREVIOUS" "_PREVIOUS_FILE" }}
{{- if has (printf "%s%s" $room $suffix) $appSlots }}
{{- fail "Jitsi 앱 키와 방 이름 키의 환경변수 슬롯이 겹칩니다" }}
{{- end }}
{{- end }}
{{- end }}
{{- if $j.enabled }}
{{- if not (and .Values.synctxConfig.create $enabled) }}
{{- fail "jitsi.enabled=true이면 synctxConfig.create=true와 collab.jitsi.enabled=true가 필요합니다" }}
{{- end }}
{{- if not (regexMatch "^[a-zA-Z0-9][a-zA-Z0-9.-]*$" $j.host) }}
{{- fail "jitsi.host가 필요합니다(호스트 이름만 지정)" }}
{{- end }}
{{- if or (ne $j.publicUrl (printf "https://%s" $j.host)) (ne $j.publicUrl (get $cfg "public_url")) (ne $j.appId (get $cfg "app_id" | default "synctx")) }}
{{- fail "jitsi.host/publicUrl/appId와 collab.jitsi.public_url/app_id가 일치해야 합니다" }}
{{- end }}
{{- if ne (get $cfg "xmpp_domain" | default $j.host) $j.host }}
{{- fail "내장 Jitsi의 collab.jitsi.xmpp_domain은 jitsi.host와 일치해야 합니다" }}
{{- end }}
{{- if not (regexMatch "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$" (get $cfg "app_id" | default "")) }}
{{- fail "collab.jitsi.app_id가 필요합니다" }}
{{- end }}
{{- if not $j.ingress.tlsSecretName }}
{{- fail "jitsi.ingress.tlsSecretName이 필요합니다" }}
{{- end }}
{{- if not (has $j.jvb.exposure (list "NodePort" "hostPort")) }}
{{- fail "jitsi.jvb.exposure는 NodePort 또는 hostPort입니다" }}
{{- end }}
{{- if not $j.jvb.advertisedIPs }}
{{- fail "jitsi.jvb.advertisedIPs에 브라우저에서 도달 가능한 JVB 주소를 지정하세요" }}
{{- end }}
{{- $octet := "(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])" }}
{{- $ipv4 := printf "^%s(\\.%s){3}$" $octet $octet }}
{{- $hex := "[0-9A-Fa-f]{1,4}" }}
{{- $ipv6 := printf "^((%s:){7}%s|(%s:){1,7}:|(%s:){1,6}:%s|(%s:){1,5}(:%s){1,2}|(%s:){1,4}(:%s){1,3}|(%s:){1,3}(:%s){1,4}|(%s:){1,2}(:%s){1,5}|%s:((:%s){1,6})|:((:%s){1,7}|:))$" $hex $hex $hex $hex $hex $hex $hex $hex $hex $hex $hex $hex $hex $hex $hex $hex }}
{{- range $ip := splitList "," $j.jvb.advertisedIPs }}
{{- $v6 := $ip }}
{{- if and (contains ":" $ip) (contains "." $ip) }}
{{- $tail := last (splitList ":" $ip) }}
{{- if not (regexMatch $ipv4 $tail) }}
{{- fail "jitsi.jvb.advertisedIPs는 쉼표 구분 IP 목록이어야 합니다(포트·# 불가)" }}
{{- end }}
{{- $v6 = printf "%s0:0" (trimSuffix $tail $ip) }}
{{- end }}
{{- if not (or (regexMatch $ipv4 $ip) (regexMatch $ipv6 $v6)) }}
{{- fail "jitsi.jvb.advertisedIPs는 쉼표 구분 IP 목록이어야 합니다(포트·# 불가)" }}
{{- end }}
{{- end }}
{{- if and (eq $j.jvb.exposure "NodePort") (or (lt (int $j.jvb.nodePort) 30000) (gt (int $j.jvb.nodePort) 32767) (and $j.jvb.tcpFallback (or (lt (int $j.jvb.tcpNodePort) 30000) (gt (int $j.jvb.tcpNodePort) 32767)))) }}
{{- fail "JVB NodePort는 30000~32767이어야 합니다" }}
{{- end }}
{{- if and $j.xmppSecret.create $j.xmppSecret.existingSecret }}
{{- fail "jitsi.xmppSecret.create와 existingSecret은 함께 지정할 수 없습니다" }}
{{- end }}
{{- if not (or $j.xmppSecret.create $j.xmppSecret.existingSecret) }}
{{- fail "jitsi.xmppSecret.create 또는 existingSecret이 필요합니다" }}
{{- end }}
{{- if and $j.xmppSecret.create (or (lt (len ($j.xmppSecret.jicofoPassword | default "")) 32) (lt (len ($j.xmppSecret.jvbPassword | default "")) 32)) }}
{{- fail "jitsi.xmppSecret의 jicofoPassword와 jvbPassword는 32바이트 이상이어야 합니다" }}
{{- end }}
{{- end }}
{{- if and $j (not (regexMatch "^stable-[0-9]+(-[0-9]+)?$" ($j.imageTag | default ""))) }}
{{- fail "Jitsi imageTag는 고정 stable-<번호>여야 합니다(latest 금지)" }}
{{- end }}
