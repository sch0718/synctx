{{- if .Values.git.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "synctx.fullname" . }}-git-secrets
  labels:
    app.kubernetes.io/name: git
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  read-token: {{ .Values.git.secrets.readToken | quote }}
  publish-token: {{ .Values.git.secrets.publishToken | quote }}
{{- end }}
