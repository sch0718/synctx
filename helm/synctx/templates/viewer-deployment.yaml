apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "synctx.fullname" . }}-viewer
  labels:
    app.kubernetes.io/name: viewer
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.viewer.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: viewer
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: viewer
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: viewer
          image: "{{ .Values.viewer.image.repository }}:{{ .Values.viewer.image.tag }}"
          imagePullPolicy: {{ .Values.viewer.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          {{- if or .Values.synctxConfig.create .Values.git.secrets.create .Values.git.secrets.existingSecret }}
          env:
            {{- if .Values.synctxConfig.create }}
            - name: SYNCTX_CONFIG_PATH
              value: /etc/synctx/.synctx.yaml
            {{- end }}
            {{- if or .Values.git.secrets.create .Values.git.secrets.existingSecret }}
            - name: GIT_READ_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.git.secrets.existingSecret | default (printf "%s-git-secrets" (include "synctx.fullname" .)) }}
                  key: read-token
            {{- end }}
          {{- end }}
          {{- if .Values.synctxConfig.create }}
          volumeMounts:
            - name: synctx-config
              mountPath: /etc/synctx/.synctx.yaml
              subPath: .synctx.yaml
              readOnly: true
          {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 12
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            {{- toYaml .Values.viewer.resources | nindent 12 }}
      {{- if .Values.synctxConfig.create }}
      volumes:
        - name: synctx-config
          configMap:
            name: {{ include "synctx.fullname" . }}-config
      {{- end }}
