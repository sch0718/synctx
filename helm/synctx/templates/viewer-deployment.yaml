apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "synctx.fullname" . }}-viewer
  labels:
    app.kubernetes.io/name: viewer
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.viewer.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: viewer
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: viewer
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
        # readOnlyRootFilesystem: true
      containers:
        - name: viewer
          image: "{{ .Values.viewer.image.repository }}:{{ .Values.viewer.image.tag }}"
          imagePullPolicy: {{ .Values.viewer.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          {{- if .Values.synctxConfig.create }}
          env:
            - name: SYNCTX_CONFIG_PATH
              value: /etc/synctx/.synctx.yaml
          volumeMounts:
            - name: synctx-config
              mountPath: /etc/synctx/.synctx.yaml
              subPath: .synctx.yaml
              readOnly: true
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            {{- toYaml .Values.viewer.resources | nindent 12 }}
      {{- if .Values.synctxConfig.create }}
      volumes:
        - name: synctx-config
          configMap:
            name: {{ include "synctx.fullname" . }}-config
      {{- end }}
