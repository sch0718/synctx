{{- if and (include "synctx.collabEnabled" .) .Values.collabGateway.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "synctx.fullname" . }}-collab-gateway
  labels:
    app.kubernetes.io/name: collab-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  bot-token: {{ required "collabGateway.secrets.botToken is required" .Values.collabGateway.secrets.botToken | quote }}
  viewer-service-token: {{ required "collabGateway.secrets.viewerServiceToken is required" .Values.collabGateway.secrets.viewerServiceToken | quote }}
  {{- if .Values.collabGateway.secrets.commandToken }}
  command-token: {{ .Values.collabGateway.secrets.commandToken | quote }}
  {{- end }}
{{- end }}
