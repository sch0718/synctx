apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "synctx.fullname" . }}-sync
  labels:
    app.kubernetes.io/name: sync
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  schedule: {{ .Values.sync.schedule | quote }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: sync
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          serviceAccountName: {{ include "synctx.fullname" . }}-sync
          restartPolicy: OnFailure
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: sync
              image: "{{ .Values.sync.image.repository }}:{{ .Values.sync.image.tag }}"
              imagePullPolicy: {{ .Values.sync.image.pullPolicy }}
              command: ["synctx-sync"]
              env:
                {{- if .Values.synctxConfig.create }}
                - name: SYNCTX_CONFIG_PATH
                  value: /etc/synctx/.synctx.yaml
                {{- end }}
                {{- if or .Values.git.secrets.create .Values.git.secrets.existingSecret }}
                - name: GIT_READ_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.git.secrets.existingSecret | default (printf "%s-git-secrets" (include "synctx.fullname" .)) }}
                      key: read-token
                {{- end }}
                {{- if or .Values.feedback.secrets.create .Values.feedback.secrets.existingSecret }}
                {{- if .Values.feedback.secrets.opApiKey }}
                - name: OPENPROJECT_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.feedback.secrets.existingSecret | default (printf "%s-feedback-secrets" (include "synctx.fullname" .)) }}
                      key: openproject-api-key
                {{- end }}
                {{- if .Values.feedback.secrets.xwikiCredential }}
                - name: XWIKI_CREDENTIAL
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.feedback.secrets.existingSecret | default (printf "%s-feedback-secrets" (include "synctx.fullname" .)) }}
                      key: xwiki-credential
                {{- end }}
                {{- if or .Values.feedback.secrets.xwikiHtmlCredentialEnabled .Values.feedback.secrets.xwikiHtmlCredential }}
                - name: XWIKI_HTML_CREDENTIAL
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.feedback.secrets.existingSecret | default (printf "%s-feedback-secrets" (include "synctx.fullname" .)) }}
                      key: xwiki-html-credential
                {{- end }}
                {{- end }}
              {{- if or .Values.synctxConfig.create .Values.sync.persistence.enabled }}
              volumeMounts:
                {{- if .Values.synctxConfig.create }}
                - name: synctx-config
                  mountPath: /etc/synctx/.synctx.yaml
                  subPath: .synctx.yaml
                  readOnly: true
                {{- end }}
                {{- if .Values.sync.persistence.enabled }}
                - name: sync-state
                  mountPath: /data/sync-state
                {{- end }}
              {{- end }}
              resources:
                {{- toYaml .Values.sync.resources | nindent 16 }}
          {{- if or .Values.synctxConfig.create .Values.sync.persistence.enabled }}
          volumes:
            {{- if .Values.synctxConfig.create }}
            - name: synctx-config
              configMap:
                name: {{ include "synctx.fullname" . }}-config
            {{- end }}
            {{- if .Values.sync.persistence.enabled }}
            - name: sync-state
              persistentVolumeClaim:
                claimName: {{ include "synctx.fullname" . }}-sync-state
            {{- end }}
          {{- end }}
