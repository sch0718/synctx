apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "synctx.fullname" . }}-sync
  labels:
    app.kubernetes.io/name: sync
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "synctx.fullname" . }}-sync-role
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "synctx.fullname" . }}-sync-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "synctx.fullname" . }}-sync-role
subjects:
  - kind: ServiceAccount
    name: {{ include "synctx.fullname" . }}-sync
    namespace: {{ .Release.Namespace }}
