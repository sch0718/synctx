{{- $render := .Values.viewer.renderTokenSecret | default dict }}
{{- if $render.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "synctx.fullname" . }}-viewer-render
type: Opaque
stringData:
  render-secret: {{ required "viewer.renderTokenSecret.create=true이면 current가 필요합니다" $render.current | quote }}
  {{- if $render.previous }}
  render-secret-previous: {{ $render.previous | quote }}
  {{- end }}
{{- end }}
