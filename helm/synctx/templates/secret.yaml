{{- if .Values.feedback.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "synctx.fullname" . }}-feedback-secrets
  labels:
    app.kubernetes.io/name: feedback
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  hmac-key: {{ required "feedback.secrets.hmacKey is required" .Values.feedback.secrets.hmacKey | quote }}
  hash-salt: {{ required "feedback.secrets.hashSalt is required" .Values.feedback.secrets.hashSalt | quote }}
  smtp-credential: {{ required "feedback.secrets.smtpCredential is required" .Values.feedback.secrets.smtpCredential | quote }}
  {{- if .Values.feedback.secrets.opApiKey }}
  openproject-api-key: {{ .Values.feedback.secrets.opApiKey | quote }}
  {{- end }}
  {{- if .Values.feedback.secrets.xwikiCredential }}
  xwiki-credential: {{ .Values.feedback.secrets.xwikiCredential | quote }}
  {{- end }}
  {{- if .Values.feedback.secrets.xwikiHtmlCredential }}
  xwiki-html-credential: {{ .Values.feedback.secrets.xwikiHtmlCredential | quote }}
  {{- end }}
{{- end }}
