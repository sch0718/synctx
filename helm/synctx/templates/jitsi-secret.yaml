{{- range $slot := list "jwtSecret" "roomSecret" "xmppSecret" }}
{{- $s := get ($.Values.jitsi | default dict) $slot | default dict }}
{{- if $s.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "synctx.fullname" $ }}-jitsi-{{ $slot | kebabcase }}
type: Opaque
stringData:
  {{- if eq $slot "xmppSecret" }}
  jicofo-password: {{ $s.jicofoPassword | quote }}
  jvb-password: {{ $s.jvbPassword | quote }}
  {{- else }}
  current: {{ $s.current | quote }}
  {{- if $s.previous }}
  previous: {{ $s.previous | quote }}
  {{- end }}
  {{- end }}
{{- end }}
{{- end }}
