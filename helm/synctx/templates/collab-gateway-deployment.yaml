{{- if include "synctx.collabEnabled" . }}
{{- $cg := .Values.collabGateway }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "synctx.fullname" . }}-collab-gateway
  labels:
    app.kubernetes.io/name: collab-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  # 알림 상태 파일을 한 곳에서만 쓰므로 복제본은 1개, 교체할 때도 겹치지 않게 Recreate
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: collab-gateway
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: collab-gateway
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: collab-gateway
          image: "{{ $cg.image.repository }}:{{ $cg.image.tag }}"
          imagePullPolicy: {{ $cg.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: SYNCTX_CONFIG_PATH
              value: /etc/synctx/.synctx.yaml
            - name: SYNCTX_COLLAB_STATE_PATH
              value: /data/collab-gateway
            - name: MATTERMOST_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "synctx.collabSecretName" . }}
                  key: bot-token
            - name: VIEWER_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "synctx.collabSecretName" . }}
                  key: viewer-service-token
            - name: MATTERMOST_COMMAND_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "synctx.collabSecretName" . }}
                  key: command-token
                  optional: true
          volumeMounts:
            - name: synctx-config
              mountPath: /etc/synctx/.synctx.yaml
              subPath: .synctx.yaml
              readOnly: true
            - name: state
              mountPath: /data/collab-gateway
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 12
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            {{- toYaml $cg.resources | nindent 12 }}
      volumes:
        - name: synctx-config
          configMap:
            name: {{ include "synctx.fullname" . }}-config
        - name: state
          persistentVolumeClaim:
            claimName: {{ include "synctx.fullname" . }}-collab-gateway-state
{{- end }}
