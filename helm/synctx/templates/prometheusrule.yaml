{{- if .Values.metrics.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "synctx.fullname" . }}-alerts
  labels:
    app.kubernetes.io/name: {{ include "synctx.fullname" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  groups:
    - name: synctx.rules
      rules:
        {{- $jc := dict }}
        {{- if .Values.synctxConfig.create }}
        {{- $jc = dig "collab" "jitsi" dict (fromYaml .Values.synctxConfig.data) }}
        {{- end }}
        {{- if eq (toString (dig "enabled" false $jc)) "true" }}
        - alert: SynctxJitsiTokenFailures
          expr: sum(increase(synctx_viewer_jitsi_token_failures_total[10m])) >= 5
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Jitsi 참여 토큰 발급 반복 실패"
            description: "10분 내 Jitsi 토큰 발급이 5회 이상 실패했습니다. 사유별 메트릭과 회의 시간·설정·키를 확인하세요."
        {{- end }}
        # 1. Sync가 30분 이상 성공하지 못함
        - alert: SynctxSyncNoSuccess
          expr: time() - synctx_sync_last_success_timestamp{repo_id!=""} > 1800
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Sync Engine 30분 이상 성공 없음"
            description: "Sync Engine이 30분 넘게 성공적인 동기화를 완료하지 못했습니다."

        # 2. Sync failure ratio가 최근 3회 평균 10% 초과
        - alert: SynctxSyncHighFailureRate
          expr: |
            sum(rate(synctx_sync_failures_total[15m]))
            / (sum(rate(synctx_sync_items_total[15m])) > 0)
            > 0.1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Sync 실패율 10% 초과"
            description: "최근 15분간 Sync 항목 처리 실패율이 10%를 초과했습니다."

        # 3. XWiki/OpenProject auth error 발생
        - alert: SynctxSyncAuthError
          expr: increase(synctx_sync_failures_total{error_type="auth_error"}[10m]) > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Sync 인증 오류 발생"
            description: "XWiki 또는 OpenProject 연동 시 인증 오류가 발생했습니다. Secret 만료 여부를 확인하세요."

        # 4. Marp publish push 실패
        - alert: SynctxMarpPublishFailed
          expr: increase(synctx_marp_publish_total{result="error"}[10m]) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Marp publish 실패"
            description: "Marp 슬라이드 publish 중 Git push 실패가 발생했습니다."

        # 5. Slides Server sidecar pull 실패
        - alert: SynctxSlidesSidecarFailed
          expr: kube_pod_container_status_restarts_total{container="sync-sidecar"} > 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Slides sidecar 반복 재시작"
            description: "Slides Server의 sync-sidecar 컨테이너가 반복 재시작하고 있습니다. Git pull 또는 worktree 손상을 확인하세요."

        # 6. Outbound Feedback mail send failure 3회 이상
        - alert: SynctxFeedbackMailFailure
          expr: increase(synctx_feedback_mail_failures_total[30m]) >= 3
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Feedback 메일 발송 3회 이상 실패"
            description: "Outbound Feedback 메일 발송이 30분 내 3회 이상 실패했습니다. SMTP 연결을 확인하세요."

        # 7. Outbound Feedback redaction failure 발생
        - alert: SynctxFeedbackRedactionFailure
          expr: increase(synctx_feedback_events_total{result="redaction_error"}[10m]) > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Feedback redaction 실패"
            description: "Outbound Feedback 이벤트 redaction 중 오류가 발생했습니다. 민감정보 유출 위험이 있으므로 즉시 확인하세요."

        # 8. PVC 사용량 80% 초과
        - alert: SynctxPVCUsageHigh
          expr: |
            kubelet_volume_stats_used_bytes{namespace="{{ .Release.Namespace }}"}
            / kubelet_volume_stats_capacity_bytes{namespace="{{ .Release.Namespace }}"}
            > 0.8
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "PVC 사용량 80% 초과"
            description: "{{ .Release.Namespace }} 네임스페이스의 PVC 사용량이 80%를 초과했습니다."

        # 9. readiness failure 5분 지속
        - alert: SynctxReadinessFailure
          expr: kube_pod_status_ready{namespace="{{ .Release.Namespace }}", condition="true"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod readiness 5분 이상 실패"
            description: "{{ .Release.Namespace }} 네임스페이스에서 Pod가 5분 이상 ready 상태가 아닙니다."

        # Viewer 5xx 에러율
        - alert: SynctxViewerHighErrorRate
          expr: |
            sum(rate(synctx_http_requests_total{service="viewer",status=~"5.."}[5m]))
            / sum(rate(synctx_http_requests_total{service="viewer"}[5m]))
            > 0.05
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Viewer 5xx 에러율 5% 초과"
            description: "Viewer 서비스의 5xx 에러율이 5%를 초과했습니다."

        # 10. synctx-html 합본이 허용되지 않은 주소나 크기 초과로 거부됨
        - alert: SynctxHtmlBundleRejected
          expr: sum by (repo_id) (increase(synctx_html_bundle_total{result=~"disallowed_host|too_large"}[1h])) >= 1
          labels:
            severity: warning
          annotations:
            summary: "synctx-html 합본 거부"
            description: "synctx-html 블록이 허용되지 않은 외부 주소 또는 크기 상한 때문에 합본되지 않았습니다. 대상 저장소는 repo_id 라벨을 확인하세요."

{{- if include "synctx.collabEnabled" . }}
        # 11. Collab Gateway 알림 발송 반복 실패
        - alert: SynctxCollabNotificationFailures
          expr: sum(increase(synctx_collab_notifications_total{result="failed"}[30m])) >= 5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Collab 알림 발송 반복 실패"
            description: "Mattermost로 알림을 보내지 못하는 경우가 30분 내 5회 이상입니다. Mattermost 주소와 봇 토큰, NetworkPolicy를 확인하세요."

        # 12. Collab Gateway가 알림 발송을 포기함
        - alert: SynctxCollabNotificationGaveUp
          expr: sum(increase(synctx_collab_notifications_total{result="gave_up"}[1h])) > 0
          labels:
            severity: critical
          annotations:
            summary: "Collab 알림 발송 포기"
            description: "연속 실패로 일부 알림을 포기했습니다. 봇 토큰 만료나 채널 매핑 오류를 확인하세요."

        # 13. Collab Gateway가 Viewer에서 회의를 읽지 못함
        - alert: SynctxCollabViewerFetchFailing
          expr: increase(synctx_collab_viewer_fetch_failures_total[15m]) >= 10
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Collab Gateway의 Viewer 조회 실패"
            description: "회의 목록 조회가 15분 내 10회 이상 실패했습니다. Viewer 상태와 서비스 토큰(VIEWER_SERVICE_TOKEN)이 같은지 확인하세요."

        # 14. Collab Gateway 폴링이 멈춤
        - alert: SynctxCollabStalled
          expr: time() - synctx_collab_last_success_timestamp > 600 and synctx_collab_last_success_timestamp > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Collab Gateway 10분 이상 회의 조회 성공 없음"
            description: "Collab Gateway가 10분 넘게 Viewer에서 회의를 읽지 못했습니다."

        # 15. 회의 채널 매핑 누락
        - alert: SynctxCollabUnmappedChannel
          expr: increase(synctx_collab_unmapped_channel_total[1h]) > 0
          labels:
            severity: warning
          annotations:
            summary: "Collab 채널 매핑 누락"
            description: "meeting.channel에 대한 collab.gateway.channels 매핑이 없어 알림을 건너뛴 회의가 있습니다."

        # 16. /synctx 명령 토큰 인증 실패가 반복됨
        - alert: SynctxCollabCommandUnauthorized
          expr: increase(synctx_collab_commands_total{result="unauthorized"}[10m]) >= 5
          labels:
            severity: warning
          annotations:
            summary: "Collab /synctx 명령 인증 실패 반복"
            description: "슬래시 명령 요청의 토큰 검증이 10분 안에 5회 이상 실패했습니다. Mattermost 명령 토큰과 Secret(command-token)이 같은지, 외부에서 Gateway를 두드리는지 확인하세요."
{{- end }}
{{- end }}
