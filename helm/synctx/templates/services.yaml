apiVersion: v1
kind: Service
metadata:
  name: {{ include "synctx.fullname" . }}-viewer
  labels:
    app.kubernetes.io/name: viewer
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: viewer
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 80
      targetPort: http
---
