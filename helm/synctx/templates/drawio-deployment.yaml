apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "synctx.fullname" . }}-drawio
  labels:
    app.kubernetes.io/name: drawio
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.drawio.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: drawio
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: drawio
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: drawio
          image: "{{ .Values.drawio.image.repository }}:{{ .Values.drawio.image.tag }}"
          imagePullPolicy: {{ .Values.drawio.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            {{- toYaml .Values.drawio.resources | nindent 12 }}
