# values-local.yaml - 로컬 minikube 개발 환경 설정
#
# 사용법: helm upgrade --install synctx helm/synctx -f helm/synctx/values-local.yaml

# ── synctx 서비스 이미지 (로컬 빌드) ──
viewer:
  image:
    repository: synctx/viewer
    tag: "latest"
    pullPolicy: Never
  replicaCount: 1

cdn:
  image:
    repository: synctx/cdn
    tag: "latest"
    pullPolicy: Never
  replicaCount: 1
  persistence:
    enabled: true
    size: 1Gi

sync:
  image:
    repository: synctx/sync
    tag: "latest"
    pullPolicy: Never
  schedule: "*/5 * * * *"
  persistence:
    enabled: true
    size: 1Gi

marp:
  image:
    repository: synctx/marp
    tag: "latest"
    pullPolicy: Never
  replicaCount: 1

slides:
  image:
    repository: nginx
    tag: "1.25.4-alpine"
    pullPolicy: IfNotPresent
  persistence:
    enabled: false
  sidecar:
    image:
      repository: alpine/git
      tag: "2.43.0"
      pullPolicy: IfNotPresent
  replicaCount: 1
  publishRepoUrl: "https://github.com/example-org/published-slides.git"
  pollingIntervalSeconds: "120"

drawio:
  image:
    repository: jgraph/drawio
    tag: "24.2.5"
    pullPolicy: IfNotPresent
  replicaCount: 1

# ── Feedback (로컬에서는 Mailhog 사용) ──
feedback:
  enabled: true
  image:
    repository: synctx/feedback
    tag: "latest"
    pullPolicy: Never
  schedule: "*/10 * * * *"
  secrets:
    create: true
    hmacKey: "local-dev-hmac-key-for-testing"
    hashSalt: "local-dev-hash-salt"
    smtpCredential: "mailhog.synctx-deps.svc.cluster.local:1025"
    opApiKey: "local-openproject-api-key"

# ── Ingress (minikube, TLS via cert-manager) ──
ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    cert-manager.io/cluster-issuer: ca-issuer
  tls:
    - hosts:
        - synctx.synctx.local
      secretName: synctx-tls
  hosts:
    - host: synctx.synctx.local
      paths:
        - path: /view(/.*)?
          pathType: ImplementationSpecific
          backend: viewer
        - path: /cdn(/.*)?
          pathType: ImplementationSpecific
          backend: cdn
        - path: /marp(/.*)?
          pathType: ImplementationSpecific
          backend: marp
        - path: /slides(/.*)?
          pathType: ImplementationSpecific
          backend: slides
        - path: /drawio(/.*)?
          pathType: ImplementationSpecific
          backend: drawio

# ── .synctx.yaml 설정 (ConfigMap) ──
# 스키마: SynctxConfig (shared/synctx-common/src/synctx_common/config.py)
synctxConfig:
  create: true
  data: |
    synctx:
      version: "1"

    runtime:
      environment: development
      public_base_url: "https://synctx.synctx.local"

    authz:
      enabled: false

    repositories:
      - id: synctx-docs
        name: "synctx docs"
        url: "https://github.com/sch0718/synctx.git"
        default_ref: main
        auth:
          type: none
        watch_paths:
          - "docs/**/*.md"

    mappings:
      - match:
          path_prefix: "docs/"
          extensions: [".md"]
        target: xwiki
        xwiki:
          space_from: directory
          page_from: filename

    targets:
      xwiki:
        base_url: "http://xwiki.synctx-deps.svc.cluster.local:8080"
        wiki: xwiki
        syntax: markdown/1.2
        auth:
          type: basic
          credential_env: XWIKI_CREDENTIAL
      openproject:
        base_url: "http://openproject.synctx-deps.svc.cluster.local:8080"
        auth:
          type: token
          credential_env: OPENPROJECT_API_KEY
        status_map:
          open: 1
          closed: 13
          done: 12

    viewer:
      cdn_base_url: "https://synctx.synctx.local/cdn"

    marp:
      publish_repo: "https://github.com/sch0718/synctx-slides-test.git"
      publish_branch: main

    sync:
      on_delete: mark
      dry_run: true

    harness:
      required_context_files:
        - system_prompt.md
        - project_state.yaml
        - glossary.md
        - decision-log.md

    outbound_feedback:
      enabled: true
      outbound_mail:
        smtp_host: "mailhog.synctx-deps.svc.cluster.local"
        smtp_port: 1025
        from: "synctx@local.dev"
        to: "test@local.dev"

# ── 관측성 (기존 monitoring 네임스페이스의 Prometheus/Grafana 활용) ──
metrics:
  enabled: true
