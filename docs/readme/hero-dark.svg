.sc{opacity:0;animation:scene 16.8s linear infinite backwards}
.rise{transform-box:fill-box;animation:rise 16.8s cubic-bezier(.2,.8,.2,1) infinite backwards}
.pop{transform-box:fill-box;transform-origin:center;animation:pop 16.8s ease-out infinite backwards}
.fade{opacity:0;animation:fade 16.8s linear infinite backwards}
.flow{stroke-dasharray:6 6;animation:flow 16.8s linear infinite backwards}
.tap{transform-box:fill-box;transform-origin:center;opacity:0;animation:tap 16.8s ease-out infinite backwards}
@keyframes scene{0%{opacity:0}2.083%{opacity:1}22.917%{opacity:1}25.000%{opacity:0}100%{opacity:0}}
@keyframes rise{0%{opacity:0;transform:translateY(12px)}2.679%,25.000%{opacity:1;transform:none}25.060%,100%{opacity:0;transform:none}}
@keyframes pop{0%{transform:scale(0)}1.786%{transform:scale(1.12)}2.679%,25.000%{transform:scale(1)}25.060%,100%{transform:scale(0)}}
@keyframes fade{0%{opacity:0}1.786%,25.000%{opacity:1}25.060%,100%{opacity:0}}
@keyframes flow{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-408}}
@keyframes tap{0%{opacity:0;transform:scale(.4)}0.714%{opacity:1;transform:scale(1)}4.167%{opacity:0;transform:scale(1.9)}100%{opacity:0;transform:scale(1.9)}}
@media (prefers-reduced-motion:reduce){
*{animation:none!important}
.s0{opacity:1}
.rise,.fade{opacity:1;transform:none}
.pop{transform:none}
.tap{opacity:0}
}</style>
