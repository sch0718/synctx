<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="motion-title motion-desc">
<title id="motion-title">synctx 소개</title>
<desc id="motion-desc">synctx 소개: 1. 외부망에서 작성(AI와 함께 Markdown·Front Matter로) → 2. Git으로 반입(단방향 동기화, Git이 원본) → 3. Viewer에서 읽고 회의(검색·회의 메모·발표·근거) → 4. 내부 도구로 동기화(XWiki 문서·OpenProject 작업)</desc>
