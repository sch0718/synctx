<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="usage-title usage-desc">
  <title id="usage-title">정적 열람 사이트 만들기</title>
  <desc id="usage-desc">저장소와 내보낼 범위를 정하고, Access·공개·로그인 중 열람 방식별 준비를 마친 뒤, GitHub Actions로 빌드·검사·Pages 배포하고(Access·로그인은 접근 점검, 공개는 직접 확인), 로그인 모드는 이전 공개 배포를 지운 뒤 읽기 전용 사이트를 열람합니다. 점검을 통과하기 전에는 주소를 공유하지 않습니다.</desc>
  <style>
    text{font-family:-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Segoe UI', sans-serif}
  </style>
  <rect x="1" y="1" width="958" height="418" rx="24" fill="#0d1117" stroke="#8b949e"/>
  <text x="32" y="42" font-size="24" font-weight="800" fill="#e6edf3">정적 열람 사이트 만들기</text>
  <text x="32" y="66" font-size="12.5" fill="#8b949e">Cloudflare Pages · 시연·열람용 · 읽기 전용</text>

  <rect x="32" y="88" width="200" height="270" rx="16" fill="#161b22"/>
  <circle cx="60" cy="116" r="14" fill="#58a6ff"/>
  <text x="60" y="121" text-anchor="middle" font-size="14" font-weight="800" fill="#0d1117">1</text>
  <text x="48" y="153" font-size="15" font-weight="700" fill="#e6edf3">저장소·범위 정하기</text>
  <text x="48" y="180" font-size="12" fill="#8b949e">
    <tspan x="48" dy="0">static-export.yaml에</tspan>
    <tspan x="48" dy="19">저장소와 내보낼 범위 지정</tspan>
    <tspan x="48" dy="28">include · exclude로 선택</tspan>
    <tspan x="48" dy="28">점으로 시작하는 경로는</tspan>
    <tspan x="48" dy="19">기본 제외</tspan>
  </text>

  <path d="M239 220 H249 M245 215 L250 220 L245 225" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="264" y="88" width="200" height="270" rx="16" fill="#1a2c41"/>
  <circle cx="292" cy="116" r="14" fill="#58a6ff"/>
  <text x="292" y="121" text-anchor="middle" font-size="14" font-weight="800" fill="#0d1117">2</text>
  <text x="280" y="151" font-size="14" font-weight="700" fill="#e6edf3">
    <tspan x="280" dy="0">열람 방식 고르고</tspan>
    <tspan x="280" dy="18">준비하기</tspan>
  </text>
  <text x="280" y="192" font-size="11.5" fill="#e6edf3">
    <tspan x="280" dy="0">Cloudflare Access (기본)</tspan>
    <tspan x="280" dy="16">Access 앱 · 사전 점검</tspan>
    <tspan x="280" dy="23">공개 모드 · 공개 범위 확인</tspan>
    <tspan x="280" dy="16">STATIC_EXPORT_PUBLIC=true</tspan>
    <tspan x="280" dy="23">로그인 모드</tspan>
    <tspan x="280" dy="16">STATIC_EXPORT_LOGIN=true</tspan>
    <tspan x="280" dy="16">D1 · Firebase · Fail closed 확인</tspan>
  </text>
  <text x="280" y="339" font-size="11.5" font-weight="700" fill="#e6edf3">모드별 준비를 끝낸 뒤 배포</text>

  <path d="M471 220 H481 M477 215 L482 220 L477 225" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="496" y="88" width="200" height="270" rx="16" fill="#161b22"/>
  <circle cx="524" cy="116" r="14" fill="#58a6ff"/>
  <text x="524" y="121" text-anchor="middle" font-size="14" font-weight="800" fill="#0d1117">3</text>
  <text x="512" y="153" font-size="15" font-weight="700" fill="#e6edf3">워크플로 실행</text>
  <text x="512" y="180" font-size="12" fill="#8b949e">
    <tspan x="512" dy="0">GitHub Actions</tspan>
    <tspan x="512" dy="19">workflow_dispatch</tspan>
    <tspan x="512" dy="19">→ 빌드·산출물 검사</tspan>
    <tspan x="512" dy="19">→ Pages 배포</tspan>
    <tspan x="512" dy="28">Access·로그인:</tspan>
    <tspan x="512" dy="19">자동 접근 점검</tspan>
    <tspan x="512" dy="17">로그인은 손으로 확인하고</tspan>
    <tspan x="512" dy="17">이전 공개 배포 삭제</tspan>
    <tspan x="512" dy="24">공개: 직접 열람 확인</tspan>
  </text>

  <path d="M703 220 H713 M709 215 L714 220 L709 225" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="728" y="88" width="200" height="270" rx="16" fill="#161b22"/>
  <circle cx="756" cy="116" r="14" fill="#58a6ff"/>
  <text x="756" y="121" text-anchor="middle" font-size="14" font-weight="800" fill="#0d1117">4</text>
  <text x="744" y="153" font-size="15" font-weight="700" fill="#e6edf3">열람</text>
  <text x="744" y="180" font-size="12" fill="#8b949e">
    <tspan x="744" dy="0">Viewer 화면 그대로</tspan>
    <tspan x="744" dy="19">읽기 전용으로 열람</tspan>
    <tspan x="744" dy="28">로그인 모드에서는</tspan>
    <tspan x="744" dy="19">/admin에서 열람자 관리</tspan>
    <tspan x="744" dy="28">/settings에서</tspan>
    <tspan x="744" dy="19">내 계정·로그아웃</tspan>
  </text>

  <text x="480" y="391" text-anchor="middle" font-size="14" font-weight="700" fill="#e6edf3">점검을 통과하기 전에는 주소를 공유하지 않습니다</text>
</svg>
