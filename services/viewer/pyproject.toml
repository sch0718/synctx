[project]
name = "synctx-viewer"
version = "0.8.0"
description = "Viewer Service for synctx"
requires-python = ">=3.13"
dependencies = [
    "synctx-common",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "markdown>=3.6",
    "pypdf>=4.2.0",
    "websockets>=12.0",
    "httpx>=0.27.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
