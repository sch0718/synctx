[project]
name = "synctx-cdn"
version = "0.8.1"
description = "CDN Service for synctx"
requires-python = ">=3.13"
dependencies = [
    "synctx-common",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    "aiofiles>=24.1.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
