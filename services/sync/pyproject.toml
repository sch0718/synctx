[project]
name = "synctx-sync"
version = "0.8.1"
license = "PolyForm-Noncommercial-1.0.0"
description = "Sync Engine for synctx"
requires-python = ">=3.13"
dependencies = [
    "synctx-common",
    "httpx>=0.27.0",
    "kubernetes>=30.1.0",
    "pydantic>=2.7.0"
]

[project.scripts]
synctx-sync = "sync_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
