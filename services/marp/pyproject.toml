[project]
name = "synctx-marp"
version = "0.8.1"
license = "PolyForm-Noncommercial-1.0.0"
description = "Marp Service for synctx"
requires-python = ">=3.13"
dependencies = [
    "synctx-common",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
