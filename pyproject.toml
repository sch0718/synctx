[project]
name = "synctx"
version = "0.6.0"
description = "Markdown based Orchestrated Knowledge Flow system"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "synctx-common",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"

[tool.uv.workspace]
members = [
    "shared/synctx-common",
    "services/viewer",
    "services/cdn",
    "services/marp",
    "services/sync",
    "services/feedback",
]

[tool.uv.sources]
synctx-common = { workspace = true }
