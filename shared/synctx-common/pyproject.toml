[project]
name = "synctx-common"
version = "0.8.0"
description = "Shared common library for synctx microservices"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0.1",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "fastapi>=0.111.0",
    "prometheus-client>=0.20.0",
    "python-json-logger>=3.1.0"
]

[project.scripts]
synctx = "synctx_common.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synctx_common"]
